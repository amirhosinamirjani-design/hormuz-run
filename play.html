<!doctype html>

<title>Hormuz Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a35;font-family:system-ui,Segoe UI,sans-serif;touch-action:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,147.06vh);height:min(100vh,68vw);background:#087eaa;touch-action:none}

<body>
<canvas id="game" width="1000" height="680" aria-label="Hormuz Run game"></canvas>
<script>
(() => {
  const c=document.querySelector('#game'), g=c.getContext('2d'), W=1000,H=680;
  const memorialPortrait=new Image();
  memorialPortrait.src='agha.jpg';
  memorialPortrait.onerror=()=>{memorialPortrait.onerror=null;memorialPortrait.src='memorial_portrait.svg'};
  const SPACE_UNLOCK_SCORE=1000;
  const WEAPON_UNLOCK_SCORE=2000;
  const WIN_SCORE=20000;
  const DIFFICULTY_SCORE_STEP=1000;
  const BASE_HULL=4;
  const PLAYER_TORPEDO_SPEED=680;
  const ENEMY_TORPEDO_SPEED=125;
  const ENEMY_DESTROY_SCORE=180;
  let state='menu', score=0, coins=0, health=BASE_HULL, maxHealth=BASE_HULL, stage=1, cargo=0, goal=4, boost=100, space=false;
  let notice=0, noticeLabel='', elapsed=0, spawn=0, enemySpawn=0, shotClock=0, last=0, difficulty=0, hurtTimer=0;
  let audioEnabled=true, graphicsQuality='high', audioContext=null;
  let language=localStorage.getItem('hormuz-language')==='fa'?'fa':'en';
  let musicVolume=.65,effectsVolume=.5,musicTimer=null,musicStep=0;
  let ship={x:105,y:350,vx:0,vy:0};
  let crates=[], hazards=[], particles=[], bullets=[], enemyBullets=[], enemies=[], keys=new Set(), pointers=new Map();
  let upgrades={rapid:0,cannon:0,damage:1,armor:0,engine:0};
  let tankers=[{x:180,y:320,speed:30,flag:'ir'},{x:490,y:410,speed:38,flag:'us'},
  {x:820,y:285,speed:34,flag:'ir'},{x:1080,y:490,speed:28,flag:'us'}];
  let stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2,p:Math.random()*7}));
  let buoys=Array.from({length:18},()=>({x:Math.random()*W,y:Math.random()*H,p:Math.random()*7}));
  const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function start(){state='playing';
    if(audioEnabled){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();startMusic()}catch(_error){}}
    score=0;coins=0;
    health=maxHealth;stage=1;
    cargo=0;goal=4;
    boost=100;space=false;
    notice=0;noticeLabel='';
    elapsed=0;spawn=enemySpawn=shotClock=hurtTimer=0;
    difficulty=0;ship={x:105,y:350,vx:0,vy:0};
    crates=[];hazards=[];
    particles=[];bullets=[];
    enemyBullets=[];enemies=[];
    tankers=[{x:180,y:320,speed:30,flag:'ir'},{x:490,y:410,speed:38,flag:'us'},{x:820,y:285,speed:34,flag:'ir'},{x:1080,y:490,speed:28,flag:'us'}];pointers.clear()}
  function burst(x,y,color,n){if(graphicsQuality==='low')n=Math.ceil(n*.45);for(let i=0;
    i<n;i++){let a=Math.random()*Math.PI*2,s=rnd(35,160);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.25,.7),color})}}
  function playTone(frequency,duration=.08,wave='sine'){if(!audioEnabled||effectsVolume<=0)return;try{
      audioContext??=new (window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume();
      const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
      oscillator.type=wave;oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.045*effectsVolume,audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);oscillator.connect(gain);gain.connect(audioContext.destination);
      oscillator.start();oscillator.stop(audioContext.currentTime+duration);
    }catch(_error){}}
  function musicNote(frequency,duration,volume,wave='triangle'){if(!audioEnabled||!audioContext||volume<=0)return;
    const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;
    oscillator.type=wave;oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.001,now);
    gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),now+.04);
    gain.gain.exponentialRampToValueAtTime(.001,now+duration);
    oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now);oscillator.stop(now+duration+.02);}
  function startMusic(){if(!audioEnabled||!audioContext||musicTimer||musicVolume<=0)return;scheduleMusic()}
  function stopMusic(){if(musicTimer)clearTimeout(musicTimer);musicTimer=null}
  function scheduleMusic(){if(!audioEnabled||musicVolume<=0||!audioContext){musicTimer=null;return}
    let intensity=Math.min(10,difficulty),tempo=Math.max(300,480-difficulty*3);
    const tune=[293.66,349.23,392,440,392,349.23,293.66,261.63,220,261.63,293.66,349.23,392,349.23,293.66,220];
    const note=tune[musicStep%tune.length];musicNote(note,.42,musicVolume*(.14+intensity*.008),'triangle');
    if(musicStep%4===0)musicNote(note/2,1.6,musicVolume*(.08+intensity*.004),'sine');
    if(musicStep%2===0)musicNote(73.42,.16,musicVolume*(.2+intensity*.012),'sawtooth');

  function spawnObject(){let o={x:W+30,y:rnd(130,570),speed:rnd(95,145)+stage*6+Math.min(15,difficulty*.3),p:rnd(0,7)};(Math.random()<.82?crates:hazards).push(o)}
  function controls(){let a=new Set(keys);
    for(const v of pointers.values())a.add(v);return a}
  function update(dt){
    if(state!=='playing')return;

    spawn+=dt;enemySpawn+=dt;
    shotClock-=dt;hurtTimer=Math.max(0,hurtTimer-dt);
    notice=Math.max(0,notice-dt);

      spawnObject()}

      o.y+=Math.sin(elapsed*2+o.p)*18*dt}
    crates=crates.filter(o=>o.x>-50);hazards=hazards.filter(o=>o.x>-50);
    for(const o of [...crates])if(Math.hypot(ship.x-o.x,ship.y-o.y)<34){
      crates.splice(crates.indexOf(o),1);let before=score;
      score+=100+stage*20;coins+=2+Math.floor(stage/2);

        noticeLabel='1,000 POINTS — INTO SPACE!';burst(ship.x,ship.y,'#ad91ff',40)}

        noticeLabel='CANNONS UNLOCKED — HOLD FIRE!';burst(ship.x,ship.y,'#ffbd69',24)}
      if(cargo>=goal){cargo=0;stage++;goal=4}
    }
    for(const o of [...hazards])if(Math.hypot(ship.x-o.x,ship.y-o.y)<31){hazards.splice(hazards.indexOf(o),1);

      let spread=upgrades.cannon?[-8,8]:[0];
      for(const offset of spread)bullets.push({x:ship.x+28,y:ship.y+offset,vx:PLAYER_TORPEDO_SPEED,vy:offset?offset*1.3:0,damage:upgrades.damage});
      playTone(760,.05,'square');
      shotClock=Math.max(.12,.28-upgrades.rapid*.035);
    }
    if(score>=WEAPON_UNLOCK_SCORE&&enemySpawn>Math.max(.5,2.2-difficulty*.035)){
      enemySpawn=0;
      enemies.push({x:W+40,y:rnd(140,570),hp:1+Math.floor(difficulty/7),speed:48+difficulty*2,fire:rnd(2.8,3.6),phase:rnd(0,7)});
    }
    for(const e of enemies){
      e.x-=e.speed*dt;
      e.y+=Math.sin(elapsed*2+e.phase)*14*dt;e.fire-=dt;
      if(e.fire<=0&&e.x<W-20){let a=Math.atan2(ship.y-e.y,ship.x-e.x);enemyBullets.push({x:e.x-20,y:e.y,vx:Math.cos(a)*(ENEMY_TORPEDO_SPEED+difficulty*2.5),vy:Math.sin(a)*(ENEMY_TORPEDO_SPEED+difficulty*2.5)});
        e.fire=Math.max(.65,rnd(2.8,3.6)-difficulty*.035)}
    }
    enemies=enemies.filter(e=>e.x>-70);
    for(const b of bullets){b.x+=b.vx*dt;
      b.y+=b.vy*dt}
    for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
    bullets=bullets.filter(b=>b.x<W+30&&b.y>0&&b.y<H);
    enemyBullets=enemyBullets.filter(b=>b.x>-30&&b.y>0&&b.y<H);
    for(const b of [...bullets])for(const e of [...enemies])if(Math.hypot(b.x-e.x,b.y-e.y)<27){
      bullets.splice(bullets.indexOf(b),1);
      e.hp-=b.damage;burst(b.x,b.y,'#ffd166',5);
      if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);score+=ENEMY_DESTROY_SCORE+difficulty*20;
        coins+=3;burst(e.x,e.y,'#ff745f',24)}break;
    }
    for(const b of [...enemyBullets])if(Math.hypot(ship.x-b.x,ship.y-b.y)<20){enemyBullets.splice(enemyBullets.indexOf(b),1);damagePlayer()}
    for(const e of [...enemies])if(Math.hypot(ship.x-e.x,ship.y-e.y)<34){enemies.splice(enemies.indexOf(e),1);
      damagePlayer()}
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.t-=dt});particles=particles.filter(p=>p.t>0);if(score>=WIN_SCORE)state='win';}
  function damagePlayer(){if(hurtTimer>0)return;health--;playTone(180,.15,'sawtooth');
    hurtTimer=1.2;score=Math.max(0,score-20);
    burst(ship.x,ship.y,'#ff735c',18);if(health<=0)state='over'}
  const faText={
    'START':'شروع','HORMUZ RUN':'سفر هرمز','SPACE RUN':'سفر فضایی','SETTINGS':'تنظیمات','STORE [B]':'فروشگاه [B]','STORE':'فروشگاه','HULL':'بدنه','ENEMY':'دشمن','IRAN':'ایران','OMAN':'عمان','QESHM':'قشم','HORMUZ':'هرمز','SPACE RADAR':'رادار فضایی','BOOST':'شتاب','FIRE':'شلیک','LOCK':'قفل','MEMORIAL':'یادبود','SAYYED ALI KHAMENEI':'سید علی خامنه‌ای','IN REMEMBRANCE':'به یاد او','A Persian Gulf arcade voyage':'ماجرایی آرکید در خلیج فارس','START GAME':'شروع بازی','HOW TO PLAY':'راهنمای بازی','CARGO • SHIPS • SPACE • UPGRADES':'محموله • کشتی‌ها • فضا • ارتقا','VOYAGE OVER':'پایان سفر','شکست پایان راه نیست آغاز تجربه‌ای تازه است':'شکست پایان راه نیست؛ آغاز تجربه‌ای تازه است','CONGRATULATIONS, CAPTAIN!':'تبریک، ناخدا!','پیروزی حاصل ایمان، اراده و تلاش است.':'پیروزی حاصل ایمان، اراده و تلاش است.','20,000 POINTS REACHED':'امتیاز ۲۰٬۰۰۰ رسید','TAP OR PRESS ENTER TO TRY AGAIN':'برای تلاش دوباره لمس کنید یا Enter بزنید','TAP OR PRESS ENTER TO PLAY AGAIN':'برای بازی دوباره لمس کنید یا Enter بزنید','ON':'روشن','OFF':'خاموش','MUSIC':'موسیقی','EFFECTS':'افکت‌ها','GRAPHICS':'کیفیت تصویر','HIGH':'بالا','LOW':'پایین','BACK':'بازگشت','Move: WASD, arrow keys or touch arrows':'حرکت: WASD، کلیدهای جهت یا فلش‌های لمسی','Boost: Space or purple button':'شتاب: Space یا دکمهٔ بنفش','Fire unlocks at 2,000 points: F or FIRE button':'شلیک از امتیاز ۲٬۰۰۰: کلید F یا دکمهٔ شلیک','Store: B or STORE button • collect cargo for coins':'فروشگاه: کلید B؛ برای سکه محموله جمع کنید','Reach 1,000 points to enter the moving star field':'با رسیدن به ۱٬۰۰۰ امتیاز وارد میدان ستاره‌ای شوید','CAPTAIN’S STORE':'فروشگاه ناخدا','Tap an item to buy':'برای خرید یک مورد را لمس کنید','Rapid fire':'شلیک سریع','Double cannon':'توپ دوگانه','Heavy torpedoes':'اژدر سنگین','Reinforced hull':'بدنهٔ تقویت‌شده','Engine upgrade':'ارتقای موتور','Repair hull':'تعمیر بدنه','Owned • two-shot volley':'خریداری‌شده • شلیک دوتایی','Adds a second barrel':'یک لولهٔ دوم اضافه می‌کند','Restore to':'بازیابی تا','faster shots':'شلیک سریع‌تر','faster movement':'حرکت سریع‌تر','Coins':'سکه‌ها','BUY':'خرید','MAX':'حداکثر','FINAL SCORE':'امتیاز نهایی','CLOSE  [B]':'بستن [B]','AUDIO':'صدا','LANGUAGE':'زبان','PERSIAN':'فارسی','ENGLISH':'انگلیسی','THREAT':'تهدید','CANNONS UNLOCK AT 2,000':'توپ‌ها در ۲٬۰۰۰ باز می‌شوند','HOLD FIRE TO SHOOT':'برای شلیک نگه دارید','SCORE':'امتیاز','STAGE':'مرحله','CARGO':'محموله','LEFT':'باقی‌مانده','END':'پایان'};
  function translate(s){if(language!=='fa')return s;let v=String(s);if(faText[v])return faText[v];
    v=v.replace(/^AUDIO: (ON|OFF)$/,(_,a)=>`صدا: ${faText[a]}`).replace(/^GRAPHICS: (HIGH|LOW)$/,(_,a)=>`کیفیت تصویر: ${faText[a]}`).replace(/^LANGUAGE: (PERSIAN|ENGLISH)$/,(_,a)=>`زبان: ${faText[a]}`)

      .replace(/^FINAL SCORE\s+(\d+)$/,(_,n)=>`امتیاز نهایی ${n}`).replace(/^COINS (\d+)$/,(_,n)=>`سکه ${n}`).replace(/^BUY (\d+)$/,(_,n)=>`خرید ${n}`).replace(/^Level (\d+)\/5 • faster shots$/,(_,n)=>`سطح ${n}/۵ • شلیک سریع‌تر`).replace(/^Level (\d+)\/3 • faster movement$/,(_,n)=>`سطح ${n}/۳ • حرکت سریع‌تر`).replace(/^Damage (\d+)\/4$/,(_,n)=>`قدرت ${n}/۴`).replace(/^Hull capacity (\d+)\/5$/,(_,n)=>`ظرفیت بدنه ${n}/۵`).replace(/^THREAT (\d+)  •  (.*)$/,(_,n,t)=>`تهدید ${n} • ${faText[t]||t}`).replace(/^LEFT (.+)$/,(_,n)=>`باقی‌مانده ${n}`);
    return v}
  function text(s,x,y,size=18,color='#fff',align='center'){s=translate(s);g.direction=language==='fa'?'rtl':'ltr';g.font=`800 ${size}px system-ui,Segoe UI,sans-serif`;
    g.textAlign=align;g.textBaseline='middle';

  function circle(x,y,r,color){g.fillStyle=color;

  function drawIranFlag(x,y,w,h){

  function buyAt(p){
    if(p.x>420&&p.x<580&&p.y>525&&p.y<580){state='playing';
      return}
    if(p.y<220||p.y>520||p.x<190||p.x>810)return;
    let col=p.x<500?0:1,row=Math.floor((p.y-220)/105),idx=row*2+col,it=shopItems()[idx];
    if(!it)return;
    let level=it.id==='armor'?maxHealth-3:upgrades[it.id]||0;
    if(it.id!=='repair'&&level>=it.max)return;
    if(coins<it.cost)return;
    coins-=it.cost;
    if(it.id==='rapid')upgrades.rapid++;
    if(it.id==='cannon')upgrades.cannon=1;
    if(it.id==='damage')upgrades.damage++;
    if(it.id==='armor'){maxHealth=Math.min(5,maxHealth+1);health=Math.min(maxHealth,health+1)}
    if(it.id==='engine')upgrades.engine++;
    if(it.id==='repair')health=maxHealth;}

  function pointerControl(p){let x=p.x,y=p.y;const pads=[[75,600,'left'],[185,600,'right'],[130,550,'up'],[130,650,'down'],[805,590,'fire'],[910,590,'boost']];
    let best=pads.map(a=>[Math.hypot(x-a[0],y-a[1]),a[2]]).sort((a,b)=>a[0]-b[0])[0];if(best[0]<58)return best[1];
    if(y>500&&x<260)return'left';if(y>500&&x>800)return'fire';
    let wy=H-y;return x<250?'left':x>750?'right':wy>ship.y?'up':'down'}
  c.addEventListener('pointerdown',e=>{e.preventDefault();
    c.setPointerCapture(e.pointerId);let p=pointerPos(e);
    if(state==='menu'||state==='settings'||state==='controls'){handleMenuClick(p);draw();return}
    if(state==='shop'){buyAt(p);draw();
      return}if(state!=='playing'){start();return}if(p.y>=54&&p.y<=92&&p.x>=740&&p.x<870){state='settings';
      draw();return}if(p.y>=58&&p.y<=90&&p.x>=865){state='shop';
      draw();return}pointers.set(e.pointerId,pointerControl(p));
    draw()});
  c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;
    let p=pointerPos(e);pointers.set(e.pointerId,pointerControl(p))});
  function release(e){pointers.delete(e.pointerId)}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
  const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',f:'fire',' ':'boost'};
  window.addEventListener('keydown',e=>{let k=keyMap[e.key.toLowerCase()];
    if(k){keys.add(k);e.preventDefault()}
    if(e.key.toLowerCase()==='b'&&state==='playing'){state='shop';draw()}
    else if(e.key.toLowerCase()==='b'&&state==='shop'){state='playing';draw()}
    if(e.key==='Escape'&&(state==='settings'||state==='controls')){state='menu';draw()}
    if(e.key==='Escape'&&state==='shop'){state='playing';draw()}
    if(e.key==='Enter'&&state==='menu')start();
    else if(e.key==='Enter'&&(state==='settings'||state==='controls')){state='menu';draw()}
    else if(e.key==='Enter'&&(state==='over'||state==='win'))start()});window.addEventListener('keyup',e=>keys.delete(keyMap[e.key.toLowerCase()]));
  function frame(t){let dt=last?(t-last)/1000:0;last=t;
    update(dt);draw();
    requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
