  function handleMenuClick(p){
    if(state==='menu'){
      if(p.x>=350&&p.x<=650&&p.y>=270&&p.y<=340){start();return}
      if(p.x>=350&&p.x<=650&&p.y>=342&&p.y<=412){state='settings';return}if(p.x>=350&&p.x<=650&&p.y>=414&&p.y<=484){state='controls';return}
    }else if(state==='settings'){
      if(p.x>=360&&p.x<=640&&p.y>=205&&p.y<=265){audioEnabled=!audioEnabled;if(audioEnabled){try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();startMusic();playTone(660,.09)}catch(_error){}}else stopMusic();return}
      if(p.y>=265&&p.y<=320&&p.x>=330&&p.x<=440){musicVolume=clamp(musicVolume-.1,0,1);if(!musicVolume)stopMusic();return}
      if(p.y>=265&&p.y<=320&&p.x>=560&&p.x<=670){musicVolume=clamp(musicVolume+.1,0,1);if(musicVolume)startMusic();return}
      if(p.y>=325&&p.y<=385&&p.x>=330&&p.x<=440){effectsVolume=clamp(effectsVolume-.1,0,1);return}
      if(p.y>=325&&p.y<=385&&p.x>=560&&p.x<=670){effectsVolume=clamp(effectsVolume+.1,0,1);return}
      if(p.x>=340&&p.x<=660&&p.y>=388&&p.y<=445){graphicsQuality=graphicsQuality==='high'?'low':'high';return}
      if(p.x>=340&&p.x<=660&&p.y>=440&&p.y<=490){language=language==='fa'?'en':'fa';localStorage.setItem('hormuz-language',language);return}
      if(p.y>=490&&p.y<=555){state='menu';return}
    }else if(state==='controls'&&p.y>=485&&p.y<=550){state='menu'}}

  function buyAt(p){
    if(p.x>420&&p.x<580&&p.y>525&&p.y<580){state='playing';
      return}
    if(p.y<220||p.y>520||p.x<190||p.x>810)return;
    let col=p.x<500?0:1,row=Math.floor((p.y-220)/105),idx=row*2+col,it=shopItems()[idx];
    if(!it)return;
    let level=it.id==='armor'?maxHealth-3:upgrades[it.id]||0;
    if(it.id!=='repair'&&level>=it.max)return;
    if(coins<it.cost)return;
    coins-=it.cost;
    if(it.id==='rapid')upgrades.rapid++;
    if(it.id==='cannon')upgrades.cannon=1;
    if(it.id==='damage')upgrades.damage++;
    if(it.id==='armor'){maxHealth=Math.min(5,maxHealth+1);health=Math.min(maxHealth,health+1)}
    if(it.id==='engine')upgrades.engine++;
    if(it.id==='repair')health=maxHealth;}
  function pointerPos(e){let r=c.getBoundingClientRect();
    return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  function enterFullscreen(){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{})}
  function pointerControl(p){let x=p.x,y=p.y;const pads=[[78,515,'left'],[198,515,'right'],[138,455,'up'],[138,575,'down'],[805,515,'fire'],[910,515,'boost']];
    let best=pads.map(a=>[Math.hypot(x-a[0],y-a[1]),a[2]]).sort((a,b)=>a[0]-b[0])[0];if(best[0]<76)return best[1];
    if(y>430&&x<270)return'left';if(y>430&&x>760)return'fire';
    let wy=H-y;return x<250?'left':x>750?'right':wy>ship.y?'up':'down'}
  c.addEventListener('pointerdown',e=>{e.preventDefault();
    c.setPointerCapture(e.pointerId);let p=pointerPos(e);
    if(state==='menu'||state==='settings'||state==='controls'){if(state==='menu'&&p.x>=350&&p.x<=650&&p.y>=270&&p.y<=340)enterFullscreen();handleMenuClick(p);draw();return}
    if(state==='shop'){buyAt(p);draw();
      return}if(state!=='playing'){start();return}if(p.y>=58&&p.y<=90&&p.x>=865){state='shop';
      draw();return}pointers.set(e.pointerId,pointerControl(p));
    draw()});
  c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;
    let p=pointerPos(e);pointers.set(e.pointerId,pointerControl(p))});
  function release(e){pointers.delete(e.pointerId)}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
  const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',f:'fire',' ':'boost'};
  window.addEventListener('keydown',e=>{let k=keyMap[e.key.toLowerCase()];
    if(k){keys.add(k);e.preventDefault()}
    if(e.key.toLowerCase()==='b'&&state==='playing'){state='shop';draw()}
    else if(e.key.toLowerCase()==='b'&&state==='shop'){state='playing';draw()}
    if(e.key==='Escape'&&(state==='settings'||state==='controls')){state='menu';draw()}
    if(e.key==='Escape'&&state==='shop'){state='playing';draw()}
    if(e.key==='Enter'&&state==='menu')start();
    else if(e.key==='Enter'&&(state==='settings'||state==='controls')){state='menu';draw()}
    else if(e.key==='Enter'&&(state==='over'||state==='win'))start()});window.addEventListener('keyup',e=>keys.delete(keyMap[e.key.toLowerCase()]));
  function frame(t){let dt=last?(t-last)/1000:0;last=t;
    update(dt);draw();
    requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
